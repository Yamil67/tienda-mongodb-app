<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de productos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="barra">
      <h1>Catálogo de productos</h1>
      <button id="btn-nuevo" type="button">+ Nuevo producto</button>
    </header>

    <p id="mensaje" role="status" aria-live="polite" hidden></p>

    <div class="tabla-contenedor">
      <table id="tabla">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Formulario para crear y editar -->
  <dialog id="dlg-form" aria-labelledby="form-titulo">
    <form id="form-producto">
      <h2 id="form-titulo">Nuevo producto</h2>
      <p id="form-error" class="error" role="alert" hidden></p>

      <label for="f-sku">SKU</label>
      <input id="f-sku" name="sku" required maxlength="40" pattern="[A-Za-z0-9._\-]+" placeholder="ELE-003">

      <label for="f-nombre">Nombre</label>
      <input id="f-nombre" name="nombre" required maxlength="120" placeholder="Teclado mecánico">

      <label for="f-categoria">Categoría</label>
      <input id="f-categoria" name="categoria" required maxlength="60" placeholder="Electrónica">

      <div class="fila-doble">
        <div>
          <label for="f-precio">Precio (MXN)</label>
          <input id="f-precio" name="precio" type="number" min="0" step="0.01" required>
        </div>
        <div>
          <label for="f-stock">Stock</label>
          <input id="f-stock" name="stock" type="number" min="0" step="1" required>
        </div>
      </div>

      <label for="f-atributos">Atributos (JSON, opcional)</label>
      <textarea id="f-atributos" name="atributos" rows="4" placeholder='{"color":"Negro","garantia":"1 año"}'></textarea>

      <div class="acciones">
        <button type="button" id="btn-cancelar" class="secundario">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal con el detalle de un solo producto -->
  <dialog id="dlg-detalle" aria-labelledby="detalle-titulo">
    <h2 id="detalle-titulo">Detalle del producto</h2>
    <dl id="detalle-datos"></dl>
    <div class="acciones">
      <button type="button" id="btn-cerrar-detalle">Cerrar</button>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
